services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix
    ports:
      - "6006:6006"   # Phoenix UI
      - "4317:4317"   # OTLP gRPC ingest
    environment:
      - PHOENIX_WORKING_DIR=/data
      # Enable OTLP gRPC ingestion
      - PHOENIX_GRPC_PORT=4317
    volumes:
      - phoenix_data:/data
    networks:
      - ollama-docker
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Override only what we need in verba
  verba:
    depends_on:
      phoenix:
        condition: service_healthy
    environment:
      # ---- OpenTelemetry exporter config (Verba -> Phoenix) ----
      - OTEL_SERVICE_NAME=verba
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      # Additional OpenTelemetry configuration
      - OTEL_RESOURCE_ATTRIBUTES=service.name=verba,service.version=1.0.0

networks:
  ollama-docker:
    external: false

volumes:
  phoenix_data: {}
